[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "26"

# Security headers on every page. The Content Security Policy itself is a <meta> tag that Astro
# writes into each page (astro.config.mjs), so /admin (Decap) can load its script.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000"

# Built assets have a content hash in their name, so they can be cached for a year.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The CMS editor is never cached, so the owner always gets the current config.
[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-cache"
    X-Robots-Tag = "noindex, nofollow"
